# Builds the browser version of Nebula's Edge and publishes the playable game
# as the root of the GitHub Pages site.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy playable web preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.11
          actions-cache-folder: emsdk-cache

      - name: Build the web game
        working-directory: client
        run: ./gradlew --no-daemon web:webRelease

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r client/web/build/dist/js/webapp/. site/
          rm -rf site/WEB-INF
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
